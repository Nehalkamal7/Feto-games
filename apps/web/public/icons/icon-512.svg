<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#121829" />
      <stop offset="100%" stop-color="#07080f" />
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007A" />
      <stop offset="100%" stop-color="#FFE600" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="100" fill="url(#bgGlow)" stroke="#00F0FF" stroke-width="6" stroke-opacity="0.4" />

  <!-- Cyber Gamepad Icon -->
  <g filter="url(#glow)" transform="translate(64, 96)">
    <!-- Controller Body -->
    <path d="M 64 128 C 48 80, 96 32, 192 32 C 288 32, 336 80, 320 128 L 352 256 C 360 288, 320 320, 280 290 L 224 240 L 160 240 L 104 290 C 64 320, 24 288, 32 256 Z" 
          fill="none" stroke="url(#neonCyan)" stroke-width="16" stroke-linejoin="round" />

    <!-- D-Pad -->
    <path d="M 100 110 L 100 150 M 80 130 L 120 130" stroke="#00F0FF" stroke-width="12" stroke-linecap="round" />

    <!-- Action Buttons -->
    <circle cx="280" cy="115" r="10" fill="#FF007A" />
    <circle cx="260" cy="135" r="10" fill="#FFE600" />
    <circle cx="300" cy="135" r="10" fill="#00F0FF" />
    <circle cx="280" cy="155" r="10" fill="#39FF14" />

    <!-- Center Lightning / Bolt -->
    <path d="M 195 90 L 180 140 L 198 140 L 185 185 L 215 130 L 198 130 Z" fill="#FFE600" />
  </g>

  <!-- FETO Brand Text -->
  <text x="256" y="440" font-family="'Outfit', sans-serif, system-ui" font-weight="900" font-size="52" fill="#00F0FF" text-anchor="middle" letter-spacing="6">
    FETO GAMES
  </text>
</svg>
