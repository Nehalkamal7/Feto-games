services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - feto-prod-network

  redis:
    image: redis:7-alpine
    restart: always
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - feto-prod-network

  # Scalable Node.js Server instances (Horizontal scaling with @socket.io/redis-adapter)
  server-1:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      INSTANCE_ID: srv-node-1
      CLIENT_URL: ${CLIENT_URL}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - feto-prod-network

  server-2:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      INSTANCE_ID: srv-node-2
      CLIENT_URL: ${CLIENT_URL}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - feto-prod-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME}
        NEXT_PUBLIC_MAX_ROOM_PLAYERS: 15
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      - server-1
      - server-2
    networks:
      - feto-prod-network

volumes:
  postgres_prod_data:
  redis_prod_data:

networks:
  feto-prod-network:
    driver: bridge
